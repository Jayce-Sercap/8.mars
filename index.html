<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Открытка</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to bottom, #fff8e1, #ffccd5);
            margin: 0;
            font-family: 'Dancing Script', cursive;
            overflow: hidden;
        }

        .envelope {
            position: relative;
            width: 300px;
            height: 200px;
            perspective: 1000px;
            cursor: pointer;
        }

        .envelope-back {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #ff99bb, #ff6699);
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(255, 105, 135, 0.3);
            z-index: 1;
        }

        .letter {
            position: absolute;
            left: 50%;
            bottom: 5px;
            transform: translateX(-50%);
            width: 90%;
            height: 75%;
            background: white;
            border-radius: 5px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            text-align: center;
            color: #ff3366;
            padding: 10px;
            transition: bottom 0.8s ease-in-out;
            z-index: 4;
        }

        .envelope.open .letter {
            transition-delay: 0.3s;
            bottom: 170px; 
            z-index: 5;
        }

        .envelope-front {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #ff6699, #cc0033);
            clip-path: polygon(0 0, 50% 50px, 100% 0, 100% 100%, 0 100%);
            z-index: 5;
        }

        .flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(to bottom, #ff6699, #cc0033);
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            transform-origin: top;
            transition: transform 0.8s ease-in-out;
            z-index: 6;
        }

        .envelope.open .flap {
            transform: rotateX(180deg);
            z-index: 3;
        }

        .heart {
            position: absolute;
            width: 24px;
            height: 24px;
            background: red;
            transform: rotate(-45deg);
            opacity: 0;
            animation: float 3s linear infinite;
            filter: drop-shadow(0px 0px 5px rgba(255, 0, 0, 0.6));
        }

            .heart::before,
            .heart::after {
                content: '';
                position: absolute;
                width: 24px;
                height: 24px;
                background: red;
                border-radius: 50%;
            }

            .heart::before {
                top: -12px;
                left: 0;
            }

            .heart::after {
                left: 12px;
                top: 0;
            }

        @keyframes float {
            0% {
                transform: translateY(0) rotate(-45deg);
                opacity: 1;
            }

            100% {
                transform: translateY(-250px) rotate(-45deg);
                opacity: 0;
            }
        }

        .credit {
            position: fixed;
            bottom: 10px;
            right: 10px;
            font-size: 12px;
            color: #555;
            z-index: 6;
        }

            .credit a {
                text-decoration: none;
                color: #ff3366;
                font-weight: bold;
            }
    </style>
</head>
<body>
    <div class="envelope" onclick="openEnvelope()">
        <div class="envelope-back"></div>
        <div class="letter" id="greeting">
            <p id="message"></p>
        </div>
        <div class="envelope-front"></div>
        <div class="flap" id="flap"></div>
    </div>

    <div class="credit">
        cr: by <a href="https://t.me/Jayce_Sercap" target="_blank">@Jayce_Sercap (Telegram)</a>
    </div>

    <script>
        const messages = [
            "С 8 Марта! Пусть счастье наполняет твой день!",
            "Желаю радости и улыбок в этот прекрасный день!",
            "Пусть весна принесет тебе только счастье и удачу!",
            "С праздником! Пусть сбудутся все мечты!"
        ];

        let isAnimating = false;

        function openEnvelope() {
            if (isAnimating) return;
            isAnimating = true;

            const envelope = document.querySelector('.envelope');
            const message = document.getElementById('message');
            const flap = document.getElementById('flap');
            const letter = document.querySelector('.letter');

            if (!envelope.classList.contains('open')) {
                flap.style.transitionDelay = "0s";
                flap.style.transform = "rotateX(180deg)";

                setTimeout(() => {
                    envelope.classList.add('open');
                    letter.style.bottom = "120px";
                    createHearts();
                    setTimeout(() => isAnimating = false, 600); 
                }, 300);

                message.textContent = messages[Math.floor(Math.random() * messages.length)];
            } else {
                letter.style.bottom = "7px";

                setTimeout(() => {
                    envelope.classList.remove('open');

                    setTimeout(() => {
                        flap.style.transitionDelay = "0.3s";
                        flap.style.transform = "rotateX(0deg)";
                        setTimeout(() => isAnimating = false, 800);
                    }, 500); 
                }, 500);
            }
        }

        function createHearts() {
            for (let i = 0; i < 10; i++) {
                setTimeout(() => {
                    const heart = document.createElement("div");
                    heart.classList.add("heart");
                    document.body.appendChild(heart);

                    const x = Math.random() * window.innerWidth;
                    heart.style.left = `${x}px`;
                    heart.style.bottom = "0px";
                    heart.style.opacity = "1";

                    setTimeout(() => heart.remove(), 3000);
                }, i * 200);
            }
        }
    </script>
</body>
</html>
